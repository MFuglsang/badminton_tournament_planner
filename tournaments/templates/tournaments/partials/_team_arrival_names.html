{% load i18n %}
{% for player in team.players %}<button type="button" class="arrival-name-btn" data-player-id="{{ player.pk }}" data-toggle-url="{% url 'player_toggle_arrived' player.pk %}" data-title-arrived="{% trans "Arrived — click to undo" %}" data-title-not-arrived="{% trans "Not arrived — click to check in" %}" title="{% if player.pk in playing_pks %}{% trans "Playing now" %}{% elif player.pk in resting %}{% trans "Resting after a match" %}{% elif player.has_arrived %}{% trans "Arrived — click to undo" %}{% else %}{% trans "Not arrived — click to check in" %}{% endif %}"><span class="arrival-bullet {% if player.has_arrived %}arrived{% endif %} {% if player.pk in resting %}resting{% endif %} {% if player.pk in playing_pks %}playing{% endif %}"></span>{{ player.name }}</button>{% if not forloop.last %} &amp; {% endif %}{% endfor %}
