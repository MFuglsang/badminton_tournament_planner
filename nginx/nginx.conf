# ── Traffic-shaping rate-limit zones ─────────────────────────────────────────
# public_read  – spectator / anonymous read endpoints.
#   30 r/m ≈ 1 request every 2 s per IP; burst of 10 allows short spikes.
#   Using $binary_remote_addr keeps the shared-memory zone compact.
limit_req_zone $binary_remote_addr zone=public_read:10m rate=30r/m;

# heavy_compute – admin-only but CPU/IO-intensive routes (schedule generation,
#   print rendering, export/import).  Kept separate so a queue of heavy jobs
#   cannot starve lighter admin write operations.
#   5 r/m per IP; burst of 3 (nodelay so the burst doesn't add latency to
#   the first few requests, but extra ones are rejected with 429).
limit_req_zone $binary_remote_addr zone=heavy_compute:10m rate=5r/m;

# Return 429 Too Many Requests instead of the default 503 when a zone is
# exhausted — 429 is the semantically correct status for rate-limiting and
# is easier for clients / monitoring to distinguish from a server error.
limit_req_status 429;

server {
    listen 80;
    server_tokens off;          # don't leak nginx version in error pages / Server header
    client_max_body_size 20M;

    # DNS resolver injected by Docker into /etc/resolv.conf.
    # The actual IP is read at container startup by nginx-entrypoint.sh and
    # substituted here via the nginx template mechanism (envsubst).
    # Using a variable for the upstream defers hostname resolution to
    # request-time so nginx never fails to start if the web container
    # hasn't registered with Docker's DNS yet.
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;

    # ── Site-wide security headers ───────────────────────────────────────────
    # These complement (and override) the ones Django emits, ensuring even
    # responses that bypass Django (static / media) carry them.
    add_header X-Content-Type-Options nosniff             always;
    add_header X-Frame-Options        DENY                always;
    add_header Referrer-Policy        same-origin         always;
    add_header Cross-Origin-Opener-Policy same-origin     always;

    # ── Static / media – served directly, no Django involvement ──────────────
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Re-assert nosniff on this location (add_header replaces parent ones).
        add_header X-Content-Type-Options nosniff always;
    }

    location /media/ {
        alias /media/;
        # Force browser to download user-uploaded files instead of rendering
        # them in-place. Combined with the upload-format whitelist in the
        # TournamentForm, this is defence-in-depth against stored XSS through
        # uploaded SVG/HTML disguised as an image.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition    "attachment" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
    }

    # ── Public-read routes – rate-limited ────────────────────────────────────
    # Spectator / anonymous read-only pages.  High expected volume; throttled
    # to protect backend workers for admin operations.
    # burst=10: absorbs short spikes; nodelay: burst slots are consumed
    # immediately rather than queued, so responses are not artificially delayed.
    location = / {
        limit_req zone=public_read burst=10 nodelay;
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /public/ {
        limit_req zone=public_read burst=10 nodelay;
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Bigscreen is spectator-facing (public-read) even though it lives under
    # /tournaments/.  Matched before the admin-critical catch-all below.
    location ~ ^/tournaments/[0-9]+/bigscreen/ {
        limit_req zone=public_read burst=10 nodelay;
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Heavy-compute admin routes – separate concurrency limit ──────────────
    # These are admin-only by access control but expensive per request.
    # A dedicated zone prevents a queue of long-running jobs from consuming
    # all worker capacity while still giving them admin-tier priority over
    # the public_read zone.
    location ~ ^/tournaments/[0-9]+/(export|scoresheet|wallchart|court-signs|program/print|schedule/generate|schedule/suggestions)(/|$) {
        limit_req zone=heavy_compute burst=3 nodelay;
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;            # heavy jobs may take longer
    }

    location ~ ^/tournaments/division/[0-9]+/(generate|scoresheet|schedule/suggestions)(/|$) {
        limit_req zone=heavy_compute burst=3 nodelay;
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ~ ^/tournaments/import(/|$) {
        limit_req zone=heavy_compute burst=3 nodelay;
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ~ ^/players/upload(/|$) {
        limit_req zone=heavy_compute burst=3 nodelay;
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ~ ^/players/[0-9]+/schedule(/|$) {
        limit_req zone=heavy_compute burst=3 nodelay;
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── Admin-critical catch-all – no rate limit ──────────────────────────────
    # All remaining paths are organizer / authenticated flows.  No rate limit
    # is applied here so that admin operations are never throttled by the
    # public_read or heavy_compute zones.
    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
