<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 1440 710" width="100%" height="100%">
  <defs>
    <style>
      .court-bg { fill: #2e7d32; }
      .line { fill: none; stroke: #ffffff; stroke-width: 8; stroke-linecap: square; stroke-linejoin: miter; }
      .net { stroke: #e0e0e0; stroke-width: 6; stroke-dasharray: 6 6; }
      .net-post { fill: #000000; }
    </style>
  </defs>

  <!-- Grøn baggrund / sikkerhedszone -->
  <rect x="-50" y="-50" width="1440" height="710" class="court-bg" rx="15" />

  <!-- Ydre ramme: Double bane (13.40m x 6.10m) -->
  <rect x="0" y="0" width="1340" height="610" class="line" />

  <!-- Single sidelinjer (46 cm fra double sidelinje) -->
  <line x1="0" y1="46" x2="1340" y2="46" class="line" />
  <line x1="0" y1="564" x2="1340" y2="564" class="line" />

  <!-- Bageste servelinje for double (76 cm fra baglinje) -->
  <line x1="76" y1="0" x2="76" y2="610" class="line" />
  <line x1="1264" y1="0" x2="1264" y2="610" class="line" />

  <!-- Forreste servelinje (198 cm fra nettet / 472 cm fra baglinje) -->
  <line x1="472" y1="0" x2="472" y2="610" class="line" />
  <line x1="868" y1="0" x2="868" y2="610" class="line" />

  <!-- Centerlinje (mellem forreste og bageste servelinje) -->
  <line x1="0" y1="305" x2="472" y2="305" class="line" />
  <line x1="868" y1="305" x2="1340" y2="305" class="line" />

  <!-- Net (i midten ved 6.70m = 670) -->
  <line x1="670" y1="-10" x2="670" y2="620" class="net" />
  
  <!-- Netstænder (på double sidelinjerne) -->
  <circle cx="670" cy="0" r="10" class="net-post" />
  <circle cx="670" cy="610" r="10" class="net-post" />
</svg>
